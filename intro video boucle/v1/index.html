* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; background:#0c0c0e; overflow:hidden; }

.intro-wrap {
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

#introVideo {
  position:absolute;
  top:50%; left:50%;
  width:100%; height:100%;
  object-fit:cover;
  transform:translate(-50%, -50%);
}

.veil {
  position:absolute; inset:0;
  background:radial-gradient(ellipse at center, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 100%);
  opacity:0;
  transition:opacity 1.6s ease;
  pointer-events:none;
}
.veil.visible { opacity:1; }

.reveal {
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:34px;
  pointer-events:none;
}

.artist-name {
  font-family:'Caveat', cursive;
  font-weight:700;
  font-size:min(9vw, 110px);
  color:#ffffff;
  text-shadow:0 4px 24px rgba(0,0,0,0.5);
  opacity:0;
  transform:translateY(18px);
  transition:opacity 1.4s ease, transform 1.4s ease;
}
.artist-name.visible { opacity:1; transform:translateY(0); }

.enter-btn {
  font-family:'Quicksand', sans-serif;
  font-weight:700;
  font-size:15px;
  letter-spacing:0.04em;
  text-transform:uppercase;
  color:#1c1c1c;
  background:#ffffff;
  border:none;
  border-radius:999px;
  padding:18px 40px;
  cursor:pointer;
  opacity:0;
  transform:translateY(18px);
  transition:opacity 1.4s ease 0.35s, transform 1.4s ease 0.35s, background 0.2s ease, color 0.2s ease;
  pointer-events:none;
}
.enter-btn.visible { opacity:1; transform:translateY(0); pointer-events:auto; }
.enter-btn:hover { background:#e8a0a0; color:#ffffff; }

.skip-hint {
  position:absolute;
  bottom:26px; right:30px;
  font-family:'Quicksand', sans-serif;
  font-size:12px;
  color:rgba(255,255,255,0.55);
  letter-spacing:0.03em;
  transition:opacity 0.5s ease;
}
.skip-hint.hidden { opacity:0; }
</style>
</head>
<body>

<div class="intro-wrap">
  <video id="introVideo" autoplay muted playsinline preload="auto">
    <source src="demo_video_artiste_silencieux.mp4" type="video/mp4">
  </video>

  <div class="veil" id="veil"></div>

  <div class="reveal">
    <h1 class="artist-name" id="artistName">Nom de l'artiste</h1>
    <button class="enter-btn" id="enterBtn">Entrer dans mon univers</button>
  </div>

  <div class="skip-hint" id="skipHint">clique pour passer</div>
</div>

<script>
  const video = document.getElementById('introVideo');
  const veil = document.getElementById('veil');
  const name = document.getElementById('artistName');
  const btn = document.getElementById('enterBtn');
  const hint = document.getElementById('skipHint');

  // La vidéo se termine par un fond noir (générique / carte de fin) qu'on ne veut pas montrer.
  // On arrête donc la lecture un peu avant la vraie fin, pile sur le dernier dessin,
  // au lieu d'attendre l'événement 'ended' (qui inclurait le noir).
  // Ajuste STOP_TIME si jamais tu changes de vidéo.
  const STOP_TIME = 22.6;

  let revealed = false;
  video.loop = false; // la vidéo ne doit jamais recommencer

  function freezeAndReveal() {
    if (revealed) return;
    revealed = true;
    video.pause();
    video.currentTime = STOP_TIME;
    veil.classList.add('visible');
    name.classList.add('visible');
    btn.classList.add('visible');
    hint.classList.add('hidden');
  }

  video.addEventListener('timeupdate', () => {
    if (!revealed && video.currentTime >= STOP_TIME) {
      freezeAndReveal();
    }
  });

  // filet de sécurité si jamais 'timeupdate' ne se déclenche pas à temps
  video.addEventListener('ended', freezeAndReveal);

  // clique sur la vidéo pour sauter direct au dernier dessin (pratique pour tester vite)
  video.addEventListener('click', () => {
    if (!revealed) freezeAndReveal();
  });

  btn.addEventListener('click', () => {
    alert('Ici on redirigerait vers la page d\'accueil / la galerie du site.');
  });
</script>

</body>
